[project]
name = "provgrep"
version = "0.0.0"
description = "Search open-source code by what it does, with the license of every snippet and the evidence for it"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Juanjo Aroztegi", email = "juanjo@aroztegi.com" }]
requires-python = ">=3.14"
dependencies = [
    "license-expression>=30.4",
    # scancode-toolkit 32.5's plugin loader finds no hooks with pluggy 1.7
    "pluggy<1.7",
    "scancode-toolkit>=32.5",
]

[project.scripts]
provgrep = "provgrep.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cluecode.*", "license_expression", "licensedcode.*", "scancode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ScanCode's requirement parser uses a deprecated pyparsing API
filterwarnings = ["ignore::DeprecationWarning:packvers"]
