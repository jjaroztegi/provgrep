[project]
name = "provgrep"
version = "0.0.0"
description = "Search open-source code by what it does, with the license of every snippet and the evidence for it"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Juanjo Aroztegi", email = "juanjo@aroztegi.com" }]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1",
    "license-expression>=30.4",
    # scancode-toolkit 32.5's plugin loader finds no hooks with pluggy 1.7
    "mcp>=2.3",
    "numpy>=2.3",
    "onnxruntime>=1.31",
    "pluggy<1.7",
    "scancode-toolkit>=32.5",
    "starlette>=1.9",
    "tantivy>=0.27",
    # tree-sitter 0.26.0 reads freed nodes (py-tree-sitter#472, fixed after the release)
    "tokenizers>=0.22",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.54",
]

[project.scripts]
provgrep = "provgrep.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4",
    "pytest>=9",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cluecode.*", "license_expression", "licensedcode.*", "onnxruntime", "scancode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ScanCode's requirement parser uses a deprecated pyparsing API
filterwarnings = ["ignore::DeprecationWarning:packvers"]
