version = 1

# provgrep's own files. In-file tags are ignored: the SPDX lines in tests and attribution.py are
# data, not this repository's licensing. The later annotations override this one.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Juanjo Aroztegi"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "src/provgrep/osadl/matrixseqexpl.json"
precedence = "override"
SPDX-FileCopyrightText = "2017-2024 Open Source Automation Development Lab (OSADL) eG and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "src/provgrep/static/fonts/iosevka-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2015-2023 Renzhi Li (Belleve Invis)"
SPDX-License-Identifier = "OFL-1.1"
